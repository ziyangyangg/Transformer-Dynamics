name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      MPLCONFIGDIR: /tmp/transformer-dynamics-mpl
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
      - name: Install project
        run: python -m pip install -e ".[pretrained]"
      - name: Verify non-editable wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir /tmp/transformer-wheel .
          python -m pip install --no-deps --target /tmp/transformer-wheel-site /tmp/transformer-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/transformer-wheel-site python - <<'PY'
          from routing_lab.control_config import canonical_sha256
          from routing_lab.matrix_mqar import MatrixMQARSpec, enumerate_matrix_mqar_population
          from routing_lab.population_gf import PopulationStepConfig

          assert len(canonical_sha256({"scope": "training-aware-kernel"})) == 64
          assert PopulationStepConfig(step_size=0.1).step_size == 0.1
          spec = MatrixMQARSpec()
          assert enumerate_matrix_mqar_population(spec).size == 48
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -v
