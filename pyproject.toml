[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-routing-superposition-lab"
version = "0.1.0"
description = "Causal routing and compressed-concept compensation experiments"
requires-python = ">=3.11"
dependencies = ["torch", "numpy", "scipy", "pandas", "matplotlib"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

